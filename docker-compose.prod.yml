services:
  postgres:
    image: postgres:14
    container_name: moduBot-db
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env.prod
  qdrant:
    image: qdrant/qdrant:latest
    container_name: modu-bot-qdrant
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8001:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z

  backend:
    image: woojo230/modu-bot-be:latest
    container_name: modu-bot-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy

  ai:
    image: woojo230/modu-bot-ai:latest
    depends_on:
      qdrant:
        condition: service_healthy
    container_name: modu-bot-ai
    restart: always
    env_file:
      - .env.prod
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
